name: Update API references

on:
  schedule:
    - cron: '0 4 * * 1'  # 月曜 04:00 UTC = 13:00 JST
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          cache: 'npm'
      - name: Ensure npm 11+ (Node 20 only)
        shell: bash
        run: |
          npm_major=$(npm -v | cut -d. -f1)
          node_major=$(node -v | sed 's/^v//' | cut -d. -f1)
          if [ "$npm_major" -ge 11 ]; then
            echo "npm $(npm -v) already supports min-release-age"
          elif [ "$node_major" -ge 22 ]; then
            echo "skipping npm upgrade on Node ${node_major}: bundled npm 10 self-upgrade is broken"
          else
            npm install -g npm@latest
          fi
      - run: npm ci --ignore-scripts
      - run: npm run update:docs
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: ci/update-references
          title: 'chore: update Oura API references'
          body: 'Automated update from latest Oura OpenAPI schema.'
          commit-message: 'chore: update API references'
