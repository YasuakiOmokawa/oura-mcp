name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      # Node 20 ships npm 10 which ignores min-release-age. Node 22 also
      # ships npm 10, but its bundled `npm install -g npm@latest` is broken
      # (MODULE_NOT_FOUND: promise-retry during reify). Since `npm ci`
      # installs from lockfile and does not resolve fresh versions, the
      # cooldown is not enforced at CI install time anyway; the upgrade
      # is only useful for forward compatibility on Node 20.
      - name: Ensure npm 11+ (Node 20 only)
        shell: bash
        run: |
          npm_major=$(npm -v | cut -d. -f1)
          node_major=$(node -v | sed 's/^v//' | cut -d. -f1)
          if [ "$npm_major" -ge 11 ]; then
            echo "npm $(npm -v) already supports min-release-age"
          elif [ "$node_major" -ge 22 ]; then
            echo "skipping npm upgrade on Node ${node_major}: bundled npm 10 self-upgrade is broken"
          else
            npm install -g npm@latest
          fi
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
      # Node 20 ships npm 10 which ignores min-release-age. Node 22 also
      # ships npm 10, but its bundled `npm install -g npm@latest` is broken
      # (MODULE_NOT_FOUND: promise-retry during reify). Since `npm ci`
      # installs from lockfile and does not resolve fresh versions, the
      # cooldown is not enforced at CI install time anyway; the upgrade
      # is only useful for forward compatibility on Node 20.
      - name: Ensure npm 11+ (Node 20 only)
        shell: bash
        run: |
          npm_major=$(npm -v | cut -d. -f1)
          node_major=$(node -v | sed 's/^v//' | cut -d. -f1)
          if [ "$npm_major" -ge 11 ]; then
            echo "npm $(npm -v) already supports min-release-age"
          elif [ "$node_major" -ge 22 ]; then
            echo "skipping npm upgrade on Node ${node_major}: bundled npm 10 self-upgrade is broken"
          else
            npm install -g npm@latest
          fi
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm audit signatures
