name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      # Node 20 ships npm 10 which silently ignores min-release-age.
      # Node 22.20+ ships npm 11 already, and self-upgrading via
      # `npm install -g npm@latest` is broken on it (MODULE_NOT_FOUND
      # for promise-retry), so only upgrade when below 11.
      - name: Ensure npm 11+
        run: |
          if [ "$(npm -v | cut -d. -f1)" -lt 11 ]; then
            npm install -g npm@latest
          else
            echo "npm $(npm -v) already supports min-release-age"
          fi
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
      # Node 20 ships npm 10 which silently ignores min-release-age.
      # Node 22.20+ ships npm 11 already, and self-upgrading via
      # `npm install -g npm@latest` is broken on it (MODULE_NOT_FOUND
      # for promise-retry), so only upgrade when below 11.
      - name: Ensure npm 11+
        run: |
          if [ "$(npm -v | cut -d. -f1)" -lt 11 ]; then
            npm install -g npm@latest
          else
            echo "npm $(npm -v) already supports min-release-age"
          fi
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm audit signatures
