name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      # Node 20 ships npm 10 which ignores min-release-age. Node 22 also
      # ships npm 10, but its bundled `npm install -g npm@latest` is broken
      # (MODULE_NOT_FOUND: promise-retry during reify). Since `npm ci`
      # installs from lockfile and does not resolve fresh versions, the
      # cooldown is not enforced at CI install time anyway; the upgrade
      # is only useful for forward compatibility on Node 20.
      - name: Ensure npm 11+ (Node 20 only)
        shell: bash
        run: |
          npm_major=$(npm -v | cut -d. -f1)
          node_major=$(node -v | sed 's/^v//' | cut -d. -f1)
          if [ "$npm_major" -ge 11 ]; then
            echo "npm $(npm -v) already supports min-release-age"
          elif [ "$node_major" -ge 22 ]; then
            echo "skipping npm upgrade on Node ${node_major}: bundled npm 10 self-upgrade is broken"
          else
            npm install -g npm@latest
          fi
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
      # Node 20 ships npm 10 which ignores min-release-age. Node 22 also
      # ships npm 10, but its bundled `npm install -g npm@latest` is broken
      # (MODULE_NOT_FOUND: promise-retry during reify). Since `npm ci`
      # installs from lockfile and does not resolve fresh versions, the
      # cooldown is not enforced at CI install time anyway; the upgrade
      # is only useful for forward compatibility on Node 20.
      - name: Ensure npm 11+ (Node 20 only)
        shell: bash
        run: |
          npm_major=$(npm -v | cut -d. -f1)
          node_major=$(node -v | sed 's/^v//' | cut -d. -f1)
          if [ "$npm_major" -ge 11 ]; then
            echo "npm $(npm -v) already supports min-release-age"
          elif [ "$node_major" -ge 22 ]; then
            echo "skipping npm upgrade on Node ${node_major}: bundled npm 10 self-upgrade is broken"
          else
            npm install -g npm@latest
          fi
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm audit signatures
