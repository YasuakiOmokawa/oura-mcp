name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      # Node 20 ships npm 10 which ignores min-release-age. Node 22 also
      # ships npm 10, but its bundled `npm install -g npm@latest` is broken
      # (MODULE_NOT_FOUND: promise-retry during reify). Since `npm ci`
      # installs from lockfile and does not resolve fresh versions, the
      # cooldown is not enforced at CI install time anyway; the upgrade
      # is only useful for forward compatibility on Node 20.
      - name: Ensure npm 11+ (Node 20 only)
        shell: bash
        run: |
          npm_major=$(npm -v | cut -d. -f1)
          node_major=$(node -v | sed 's/^v//' | cut -d. -f1)
          if [ "$npm_major" -ge 11 ]; then
            echo "npm $(npm -v) already supports min-release-age"
          elif [ "$node_major" -ge 22 ]; then
            echo "skipping npm upgrade on Node ${node_major}: bundled npm 10 self-upgrade is broken"
          else
            npm install -g npm@latest
          fi
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v6.0.1

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
      # Node 20 ships npm 10 which ignores min-release-age. Node 22 also
      # ships npm 10, but its bundled `npm install -g npm@latest` is broken
      # (MODULE_NOT_FOUND: promise-retry during reify). Since `npm ci`
      # installs from lockfile and does not resolve fresh versions, the
      # cooldown is not enforced at CI install time anyway; the upgrade
      # is only useful for forward compatibility on Node 20.
      - name: Ensure npm 11+ (Node 20 only)
        shell: bash
        run: |
          npm_major=$(npm -v | cut -d. -f1)
          node_major=$(node -v | sed 's/^v//' | cut -d. -f1)
          if [ "$npm_major" -ge 11 ]; then
            echo "npm $(npm -v) already supports min-release-age"
          elif [ "$node_major" -ge 22 ]; then
            echo "skipping npm upgrade on Node ${node_major}: bundled npm 10 self-upgrade is broken"
          else
            npm install -g npm@latest
          fi
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm audit signatures
